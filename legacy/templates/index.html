            function renderTabs() {
                tabsBar.innerHTML = '';
                files.forEach(file => {
                    const tab = document.createElement('div');
                    tab.className = 'tab-item' + (file.id === activeId ? ' active' : '');
                    tab.dataset.id = file.id;
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = file.name;
                    tab.appendChild(nameSpan);
                    if (file.modified) {
                        const dot = document.createElement('span');
                        dot.className = 'modified-dot';
                        tab.appendChild(dot);
                    }
                    const close = document.createElement('button');
                    close.className = 'close-btn';
                    close.innerHTML = '✕';
                    close.title = '关闭文件';
                    close.addEventListener('click', function(e) {
                        e.stopPropagation();
                        closeFile(file.id);
                    });
                    tab.appendChild(close);
                    tab.addEventListener('click', function() { switchToFile(file.id); });
                    tabsBar.appendChild(tab);
                });
                const activeTab = tabsBar.querySelector('.tab-item.active');
                if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                updateStatusBar();
            }

            function updateTabsActive() {
                const tabs = tabsBar.querySelectorAll('.tab-item');
                tabs.forEach(tab => {
                    const id = parseInt(tab.dataset.id);
                    tab.classList.toggle('active', id === activeId);
                });
            }

            function updateTabUI(id) {
                const file = getFileById(id);
                if (!file) return;
                const tabs = tabsBar.querySelectorAll('.tab-item');
                for (let tab of tabs) {
                    if (parseInt(tab.dataset.id) === id) {
                        let dot = tab.querySelector('.modified-dot');
                        if (file.modified) {
                            if (!dot) {
                                dot = document.createElement('span');
                                dot.className = 'modified-dot';
                                tab.insertBefore(dot, tab.querySelector('.close-btn'));
                            }
                        } else {
                            if (dot) dot.remove();
                        }
                        break;
                    }
                }
                if (id === activeId) updateStatusBar();
            }

            function updateStatusBar() {
                const active = getActiveFile();
                if (active) statusFileName.textContent = active.name + (active.modified ? ' *' : '');
                else statusFileName.textContent = '无文件';
                updateStatusStats();
            }

            function updateStatusStats() {
                const content = editor.getValue();
                const lines = content.split('\n');
                statusChars.textContent = `${content.length} 字符`;
                statusLines.textContent = `${lines.length} 行`;
            }

            // ============================================================
            //  控制台
            // ============================================================
            function consoleClear() {
                consoleBody.innerHTML = '';
                compileTime.textContent = '';
            }

            function consolePrint(text, type) {
                type = type || 'info';
                const line = document.createElement('div');
                line.className = `output-line ${type}`;
                line.textContent = text;
                consoleBody.appendChild(line);
                consoleBody.scrollTop = consoleBody.scrollHeight;
            }

            function consolePrintLines(lines, type) {
                if (typeof lines === 'string') lines = lines.split('\n');
                lines.forEach(line => { if (line.trim() || line === '') consolePrint(line, type); });
            }

            // ============================================================
            //  状态 & Toast
            // ============================================================
            function setStatus(state, msg) {
                const dot = statusDot,
                    label = statusLabel,
                    led = statusLed,
                    ready = statusReady;
                dot.className = 'dot';
                if (state === 'running') {
                    dot.classList.add('running');
                    label.textContent = msg || '编译中...';
                    led.className = 'led';
                    ready.textContent = '运行中';
                } else if (state === 'error') {
                    dot.classList.add('error');
                    label.textContent = msg || '错误';
                    led.className = 'led off';
                    ready.textContent = '错误';
                } else if (state === 'success') {
                    dot.className = 'dot';
                    label.textContent = msg || '完成';
                    led.className = 'led';
                    ready.textContent = '就绪';
                } else {
                    dot.className = 'dot';
                    label.textContent = msg || '就绪';
                    led.className = 'led off';
                    ready.textContent = '就绪';
                }
            }

            function showToast(icon, message, type) {
                type = type || 'info';
                const container = toastContainer;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(30px) scale(0.96)';
                    toast.style.transition = '0.3s ease-out';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // ============================================================
            //  编译运行（单个）
            // ============================================================
            async function runCode() {
                const active = getActiveFile();
                if (!active) { showToast('⚠️', '没有打开的文件', 'error'); return; }
                const code = active.content;
                if (!code.trim()) { showToast('⚠️', '代码为空', 'error'); return; }
                const compiler = compilerSelect.value;
                setStatus('running', '编译中...');
                loadingOverlay.classList.add('active');
                consoleClear();
                consolePrint(`⏳ 正在编译 "${active.name}" ...`, 'info');
                const startTime = performance.now();
                try {
                    const response = await fetch('/compile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code, compiler })
                    });
                    const data = await response.json();
                    const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                    compileTime.textContent = `⏱ ${elapsed}s`;
                    if (data.status === 0) {
                        setStatus('success', '编译成功 ✓');
                        consolePrint('✅ 编译成功', 'success');
                        if (data.output && data.output.trim()) {
                            consolePrint('📋 编译信息:', 'info');
                            consolePrintLines(data.output.trim(), 'info');
                        }
                        if (data.program_output) {
                            consolePrint('📤 程序已在独立窗口中运行，运行结束后会暂停。', 'success');
                        }
                        showToast('✅', '编译成功，程序已运行', 'success');
                    } else {
                        setStatus('error', '编译失败 ✗');
                        consolePrint('❌ 编译错误:', 'error');
                        if (data.output) consolePrintLines(data.output.trim(), 'error');
                        else if (data.error) consolePrintLines(data.error.trim(), 'error');
                        else consolePrint('未知错误', 'error');
                        showToast('❌', '编译失败，请检查代码', 'error');
                    }
                } catch (err) {
                    setStatus('error', '后端连接失败');
                    consolePrint('⚠️ 无法连接到本地编译服务: ' + err.message, 'error');
                    consolePrint('💡 请确保已启动 Python 后端 (python app.py)', 'warning');
                    showToast('🌐', '后端服务未启动', 'error');
                } finally {
                    loadingOverlay.classList.remove('active');
                }
            }

                settingsModal.addEventListener('click', function(e) { if (e.target === settingsModal) closeSettings(); });

                // 样例事件
                addTestBtn.addEventListener('click', openAddTestDialog);
                runAllTestsBtn.addEventListener('click', runAllTests);
                clearResultsBtn.addEventListener('click', function() {
                    const active = getActiveFile();
                    if (active) {
                        active.tests.forEach(t => t.result = null);
                        renderTests();
                        showToast('🧹', '测试结果已清空', 'info');
                    }
                });

                testModalCancel.addEventListener('click', closeTestModal);
                testModalSave.addEventListener('click', saveTestModal);
                testModal.addEventListener('click', function(e) { if (e.target === testModal) closeTestModal(); });

                // 侧边栏折叠
                sidebarToggle.addEventListener('click', toggleSidebar);
                sidebarHeader.addEventListener('click', function(e) {
                    if (e.target.closest('.actions')) return;
                    toggleSidebar();
                });

                // Resize 控制台
                let isResizing = false,
                    startY = 0,
                    startHeight = 0;
                resizeHandle.addEventListener('mousedown', function(e) {
                    isResizing = true;
                    startY = e.clientY;
                    startHeight = consoleWrapper.offsetHeight;
                    document.body.style.cursor = 'ns-resize';
                    resizeHandle.classList.add('active');
                    consoleWrapper.classList.add('resizing');
                    e.preventDefault();
                });
                document.addEventListener('mousemove', function(e) {
                    if (!isResizing) return;
                    let newHeight = startHeight + (startY - e.clientY);
                    newHeight = Math.max(80, Math.min(250, newHeight));
                    consoleWrapper.style.height = newHeight + 'px';
                });
                document.addEventListener('mouseup', function() {
                    if (isResizing) {
                        isResizing = false;
                        document.body.style.cursor = '';
                        resizeHandle.classList.remove('active');
                        consoleWrapper.classList.remove('resizing');
                        if (editor) editor.refresh();
                    }
                });

                // 全局快捷键（Shift+Enter 备用）
                document.addEventListener('keydown', function(e) {
                    // Ctrl+Shift+C 清空控制台
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
                        e.preventDefault();
                        consoleClear();
                        showToast('🧹', '控制台已清空', 'info');
                    }
                });

                document.querySelector('.editor-wrapper').addEventListener('click', function() { if (editor) editor
                        .focus(); });

                if (getSidebarCollapsed()) {
                    sidebar.classList.add('collapsed');
                    sidebarArrow.classList.add('collapsed');
                    sidebarToggle.textContent = '▶';
                }
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                setupFileInput();
                initEditor();
                initEvents();
                setStatus('idle', '就绪');
                consoleClear();
                consolePrint('💻 欢迎使用 C++ 编辑器 (自动补全 + Shift+Enter 一键测试)', 'info');
                consolePrint('📌 输入时自动弹出补全提示，按 Ctrl+Space 手动触发', 'info');
                consolePrint('⌨️ Shift+Enter 一键运行全部样例，Ctrl+Enter 编译运行', 'info');
                if (!isFileSystemAccessSupported()) {
                    consolePrint('⚠️ 当前浏览器不支持 File System Access API，保存将使用下载方式', 'warning');
                }
                showToast('🚀', '编辑器已就绪', 'info');
                renderTests();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

        })();
    </script>

</body>
</html>
